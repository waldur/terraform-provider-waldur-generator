name: Generate and Push Provider

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Generator Repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate Provider
        run: go run main.go -config config.yaml

      - name: Install dependencies
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest

      - name: Format and Clean Imports
        working-directory: output
        run: |
          goimports -w .
          echo "✅ Imports cleaned with goimports"

      - name: Verify Build
        working-directory: output
        run: |
          go mod tidy
          go build .
          go test -v ./...
          echo "✅ Build and internal tests passed"

      - name: Run E2E Tests
        working-directory: output
        env:
          TF_ACC: "true"
          WALDUR_API_URL: http://127.0.0.1:8000/
          WALDUR_ACCESS_TOKEN: c44bb36d6ac6fdd0cb62fa81bf09a8522ddacd19
          WALDUR_POLL_DELAY: 1ms
          WALDUR_POLL_MIN_TIMEOUT: 1ms
        run: |
          go test -v ./e2e_test/...
          echo "✅ E2E tests passed (Replay mode)"
          rm -f terraform-provider-waldur

      - name: Verify Documentation
        working-directory: output
        run: |
          tfplugindocs generate --provider-name waldur
          echo "✅ Documentation verification passed"

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: waldur/terraform-provider-waldur
          path: target_repo
          token: ${{ secrets.WALDUR_PROVIDER_PUSH_TOKEN }}

      - name: Generate changelog
        run: |
          # Diff the previous published manifest against the freshly generated one.
          # Both the manifest and the changelog must be preserved across the wipe in
          # "Sync Files": the old manifest is the baseline, and CHANGELOG.md accrues
          # history that the wipe + rsync (which only carries output/) would drop.
          cp target_repo/provider-manifest.json /tmp/old-manifest.json 2>/dev/null || true
          cp target_repo/CHANGELOG.md /tmp/CHANGELOG.md 2>/dev/null || true
          SUBJECT=$(go run ./cmd/changelog \
            -old /tmp/old-manifest.json \
            -new output/provider-manifest.json \
            -changelog /tmp/CHANGELOG.md)
          echo "Commit subject: $SUBJECT"
          printf '%s' "$SUBJECT" > /tmp/commit-subject.txt

      - name: Sync Files
        run: |
          # Clean target repo but keep .git and .github (if we want to preserve target workflows)
          # Assuming we want to overwrite everything in target with generated output
          find target_repo -maxdepth 1 -not -name '.git' -not -name 'target_repo' -not -name '.' -exec rm -rf {} +

          # Copy generated files to target repo using rsync with exclusions
          # (output/provider-manifest.json is included and becomes next release's baseline)
          rsync -av --exclude='*_test.go' --exclude='internal/testhelpers' --exclude='e2e_test' --exclude='terraform-provider-waldur' output/ target_repo/

          # Restore the accumulated changelog that the wipe removed
          cp /tmp/CHANGELOG.md target_repo/CHANGELOG.md 2>/dev/null || true

          # Verification
          ls -la target_repo/

      - name: Commit and Push
        working-directory: target_repo
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "$(cat /tmp/commit-subject.txt)"
          git push
