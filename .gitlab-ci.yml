include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go-build

cache:
  key: go-cache
  paths:
    - .go/pkg/mod/
    - .go-build/

stages:
  - test
  - deploy

# Hidden template job containing shared environment configurations
.go-env:
  image: registry.hpc.ut.ee/mirror/library/golang:1.25
  before_script:
    - export PATH=$PATH:$GOPATH/bin

Fetch schema (pipeline):
  extends: .fetch-schema-pipeline
  variables:
    OPENAPI_SCHEMA_DEST: "waldur_api.yaml"

Fetch schema (independent):
  extends: .fetch-schema-independent
  variables:
    OPENAPI_SCHEMA_DEST: "waldur_api.yaml"

# Run verification checks (compiles generator, generates provider, builds provider, runs tests)
test:
  extends:
    - .go-env
  stage: test
  # Required when triggering manually via web:
  #   CI/CD → Run pipeline → add RELEASE_VERSION = <version, e.g. 8.0.9>
  # Set automatically when triggered from waldur-docs on tag release.
  variables:
    RELEASE_VERSION: ""
  needs:
    - job: Fetch schema (pipeline)
      optional: true
    - job: Fetch schema (independent)
      optional: true
  before_script:
    - !reference [.go-env, before_script]
  script:
    # Generate Provider
    - go run main.go -config config.yaml

    # Install dependencies
    - go install golang.org/x/tools/cmd/goimports@latest
    - go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest

    # Format and Clean Imports
    - cd output
    - goimports -w .
    - echo "✅ Imports cleaned with goimports"

    # Verify Build
    - go mod tidy
    - go build .
    - go test -v ./...
    - echo "✅ Build and internal tests passed"

    # Run E2E Tests
    - export TF_ACC="true"
    - export WALDUR_API_URL="http://127.0.0.1:8000/"
    - export WALDUR_ACCESS_TOKEN="c44bb36d6ac6fdd0cb62fa81bf09a8522ddacd19"
    - export WALDUR_POLL_DELAY="1ms"
    - export WALDUR_POLL_MIN_TIMEOUT="1ms"
    - go test -v ./e2e_test/...
    - echo "✅ E2E tests passed (Replay mode)"
    - rm -f terraform-provider-waldur

    # Verify Documentation
    - tfplugindocs generate --provider-name waldur
    - echo "✅ Documentation verification passed"
  artifacts:
    paths:
      - output/
    expire_in: 1 day
  rules:
    # Run on Merge Requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Also run on main branch pushes and manual triggers
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    # Run when triggered from waldur-docs pipeline
    - if: $CI_PIPELINE_SOURCE == "pipeline"

# Deploy/Push generated code to target repo (Only on main/web)
deploy:
  extends: .go-env
  stage: deploy
  before_script:
    - !reference [.go-env, before_script]
    - apt-get update && apt-get install -y --no-install-recommends rsync && rm -rf /var/lib/apt/lists/*
  script:
    # Determine release version for tagging (ensure "v" prefix format)
    - |
      if [ -n "$RELEASE_VERSION" ]; then
        export VERSION="v${RELEASE_VERSION#v}"
      else
        export VERSION=""
      fi

    # Checkout Target Repo
    - rm -rf $CI_PROJECT_DIR/../target_repo
    - git clone https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/terraform-provider-waldur.git $CI_PROJECT_DIR/../target_repo

    # Sync Files
    - |
      # Copy the old manifest and CHANGELOG.md to tmp to serve as baseline
      cp $CI_PROJECT_DIR/../target_repo/provider-manifest.json /tmp/old-manifest.json 2>/dev/null || true
      cp $CI_PROJECT_DIR/../target_repo/CHANGELOG.md /tmp/CHANGELOG.md 2>/dev/null || true

      # Generate provider changelog
      SUBJECT=$(go run ./cmd/changelog \
        -old /tmp/old-manifest.json \
        -new $CI_PROJECT_DIR/output/provider-manifest.json \
        -changelog /tmp/CHANGELOG.md \
        ${VERSION:+-date "$VERSION"})
      echo "Commit subject: $SUBJECT"
      printf '%s' "$SUBJECT" > /tmp/commit-subject.txt

      # Clean target repo but keep .git and .github (if we want to preserve target workflows)
      # Assuming we want to overwrite everything in target with generated output
      find $CI_PROJECT_DIR/../target_repo -maxdepth 1 -not -name '.git' -not -name 'target_repo' -not -name '.' -exec rm -rf {} +
      
      # Copy generated files to target repo using rsync with exclusions
      rsync -av --exclude='*_test.go' --exclude='internal/testhelpers' --exclude='e2e_test' --exclude='terraform-provider-waldur' --exclude='.github' $CI_PROJECT_DIR/output/ $CI_PROJECT_DIR/../target_repo/
      
      # Restore the accumulated CHANGELOG.md
      cp /tmp/CHANGELOG.md $CI_PROJECT_DIR/../target_repo/CHANGELOG.md 2>/dev/null || true

      # Verification
      ls -la $CI_PROJECT_DIR/../target_repo/

    # Commit, Tag, and Push
    - cd $CI_PROJECT_DIR/../target_repo
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add .
    - |
      # Commit and push code changes if they exist
      if ! git diff --staged --quiet; then
        git commit -m "$(cat /tmp/commit-subject.txt)"
        git push origin main
      else
        echo "No code changes to commit."
      fi

      # Push release tag to trigger goreleaser pipeline in target repository
      if [ -n "$VERSION" ]; then
        git fetch --tags
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "Tag $VERSION already exists in target repo. Skipping tag."
        else
          echo "Tagging stable release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        fi
      fi
  rules:
    # Deploy ONLY on main branch, manual triggers, or when triggered from waldur-docs
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
