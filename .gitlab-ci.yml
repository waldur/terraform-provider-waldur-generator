stages:
  - test
  - deploy

# Hidden template job containing shared environment configurations
.go-env:
  image: registry.hpc.ut.ee/mirror/library/golang:1.24
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go-build
  cache:
    key: go-cache
    paths:
      - .go/pkg/mod/
      - .go-build/
  before_script:
    - mkdir -p .go
    - export PATH=$PATH:$GOPATH/bin
    - apt-get update && apt-get install -y --no-install-recommends rsync git && rm -rf /var/lib/apt/lists/*

# Run verification checks (compiles generator, generates provider, builds provider, runs tests)
test:
  extends: .go-env
  stage: test
  script:
    # Generate Provider
    - go run main.go -config config.yaml

    # Install dependencies
    - go install golang.org/x/tools/cmd/goimports@latest
    - go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest

    # Format and Clean Imports
    - cd output
    - goimports -w .
    - echo "✅ Imports cleaned with goimports"

    # Verify Build
    - go mod tidy
    - go build .
    - go test -v ./...
    - echo "✅ Build and internal tests passed"

    # Run E2E Tests
    - export TF_ACC="true"
    - export WALDUR_API_URL="http://127.0.0.1:8000/"
    - export WALDUR_ACCESS_TOKEN="c44bb36d6ac6fdd0cb62fa81bf09a8522ddacd19"
    - export WALDUR_POLL_DELAY="1ms"
    - export WALDUR_POLL_MIN_TIMEOUT="1ms"
    - go test -v ./e2e_test/...
    - echo "✅ E2E tests passed (Replay mode)"
    - rm -f terraform-provider-waldur

    # Verify Documentation
    - tfplugindocs generate --provider-name waldur
    - echo "✅ Documentation verification passed"
  artifacts:
    paths:
      - output/
    expire_in: 1 day
  rules:
    # Run on Merge Requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Also run on main branch pushes and manual triggers
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

# Deploy/Push generated code to target repo (Only on main/web)
deploy:
  extends: .go-env
  stage: deploy
  script:
    # Checkout Target Repo
    - cd ..
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/terraform-provider-waldur.git target_repo

    # Sync Files
    - |
      # Clean target repo but keep .git and .github (if we want to preserve target workflows)
      # Assuming we want to overwrite everything in target with generated output
      find target_repo -maxdepth 1 -not -name '.git' -not -name 'target_repo' -not -name '.' -exec rm -rf {} +
      
      # Copy generated files to target repo using rsync with exclusions
      rsync -av --exclude='*_test.go' --exclude='internal/testhelpers' --exclude='e2e_test' --exclude='terraform-provider-waldur' output/ target_repo/
      
      # Verification
      ls -la target_repo/

    # Commit and Push
    - cd target_repo
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add .
    - |
      # Check if there are changes
      if git diff --staged --quiet; then
        echo "No changes to commit"
        exit 0
      fi
      
      git commit -m "Update generated provider code"
      git push
  rules:
    # Deploy ONLY on main branch or manual triggers
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
